name: point_pillar_attfuse_VN_NLL

# ============================================================
# SOURCE DOMAIN: OPV2V
# ============================================================

root_dir: '/data/s3/aziya_master_workspace/opv2v_data/train'
validate_dir: '/data/s3/aziya_master_workspace/opv2v_data/validate'

dataset: opv2v

yaml_parser: "load_point_pillar_params"


# ============================================================
# Communication / noise
# ============================================================

wild_setting:
  async: false
  async_mode: 'sim'
  async_overhead: 100
  seed: 20

  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2

  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10


# ============================================================
# Training
# ============================================================

train_params:
  batch_size: &batch_size 4
  epoches: &epoches 60
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 5


# ============================================================
# AttFuse / Intermediate Fusion
# ============================================================

fusion:
  core_method: 'IntermediateFusionDataset'
  args: []


# ============================================================
# Preprocessing
# ============================================================

preprocess:
  core_method: 'SpVoxelPreprocessor'

  args:

    # Original V2V4Real AttFuse:
    # [0.8, 0.8, 4]
    #
    # Hybrid:
    # finer OPV2V voxelization
    voxel_size: &voxel_size [0.4, 0.4, 4]

    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000

  cav_lidar_range: &cav_lidar
    [-140.8, -40, -3, 140.8, 40, 1]


# ============================================================
# Augmentation
# ============================================================

data_augment:

  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]


# ============================================================
# Postprocessing
# ============================================================

postprocess:
  core_method: 'VoxelPostprocessor'

  anchor_args:
    cav_lidar_range: *cav_lidar

    l: 3.9
    w: 1.6
    h: 1.56

    r: [0, 90]

    feature_stride: 2

    num: &achor_num 2


  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45

    # Keep low for cross-domain evaluation.
    score_threshold: 0.10


  order: 'hwl'

  max_num: 120

  nms_thresh: 0.15


# ============================================================
# MODEL: PointPillar + AttFuse
# ============================================================

model:
  core_method: point_pillar_intermediate_VN

  args:

    voxel_size: *voxel_size
    lidar_range: *cav_lidar

    anchor_number: *achor_num
    anchor_num: *achor_num

    max_cav: *max_cav


    # --------------------------------------------------------
    # Pillar VFE
    # --------------------------------------------------------

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]


    # --------------------------------------------------------
    # Scatter
    # --------------------------------------------------------

    point_pillar_scatter:
      num_features: 64


    # --------------------------------------------------------
    # BEV Backbone
    # --------------------------------------------------------

    base_bev_backbone:

      layer_nums: [3, 5, 8]

      layer_strides: [2, 2, 2]

      num_filters: [64, 128, 256]

      upsample_strides: [1, 2, 4]

      num_upsample_filter: [128, 128, 128]

      compression: 0


# ============================================================
# Loss
# ============================================================

loss:
  core_method: point_pillar_VN_loss_NLL

  args:
    cls_weight: 1.0
    reg: 2.0
    log_var_min: -7.0
    log_var_max: 7.0


# ============================================================
# Optimizer
# ============================================================

optimizer:
  core_method: Adam

  # Keep AttFuse's established LR.
  # Do NOT use F-Cooper's 0.0002.
  lr: 0.001

  args:
    eps: 1e-10
    weight_decay: 1e-4


# ============================================================
# Scheduler
# ============================================================

lr_scheduler:
  core_method: multistep
  gamma: 0.1

  # 60 epoch training
  step_size: [30, 50]