name: point_pillar_v2vnet_VN_NLL

# ============================================================
# DATASET
# Use EXACTLY the same paths as successful V2VNet baseline
# ============================================================
root_dir: '/data/s3/aziya_master_workspace/opv2v_data/train'
validate_dir: '/data/s3/aziya_master_workspace/opv2v_data/validate'

dataset: opv2v

# ============================================================
# WILD / COMMUNICATION SETTINGS
# Retained from V2V4Real-style baseline configuration
# ============================================================
wild_setting:
  async: false
  async_mode: 'real'
  async_overhead: 100
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06
  transmission_speed: 27
  backbone_delay: 10

yaml_parser: "load_point_pillar_params"

# ============================================================
# TRAINING
# Same as successful hybrid V2VNet baseline
# ============================================================
train_params:
  batch_size: &batch_size 4
  epoches: &epoches 60
  eval_freq: 1
  save_freq: 1
  max_cav: &max_cav 5

# ============================================================
# FUSION DATASET
# ============================================================
fusion:
  core_method: 'IntermediateFusionDataset'
  args: []

# ============================================================
# PREPROCESSING
# OPV2V geometry
# ============================================================
preprocess:
  core_method: 'SpVoxelPreprocessor'

  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000

  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

# ============================================================
# DATA AUGMENTATION
# ============================================================
data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

# ============================================================
# POSTPROCESSING
# Same as successful hybrid baseline
# ============================================================
postprocess:
  core_method: 'VoxelPostprocessor'

  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 4
    num: &achor_num 2

  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20

  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

# ============================================================
# MODEL
# Same hybrid V2VNet baseline architecture
# + Variance Network
# ============================================================
model:
  core_method: point_pillar_v2vnet_VN

  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num
    max_cav: *max_cav

    # Same as successful hybrid V2VNet baseline
    compression: 32
    backbone_fix: false

    # --------------------------------------------------------
    # Variance Network sampling
    # Keep if required by your VN implementation
    # --------------------------------------------------------
    num_bbox_samples: 10

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]

    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    shrink_header:
      kernal_size: [3]
      stride: [2]
      padding: [1]
      dim: [256]
      input_dim: 384

    # --------------------------------------------------------
    # Hybrid V2VNet fusion configuration
    # --------------------------------------------------------
    v2vfusion:
      use_temporal_encoding: true
      voxel_size: *voxel_size
      downsample_rate: 4
      num_iteration: 1
      in_channels: 256
      gru_flag: true
      agg_operator: "avg"

      conv_gru:
        H: 50
        W: 176
        num_layers: 1
        kernel_size: [[3, 3]]

# ============================================================
# LOSS
# VARIANCE NETWORK + NLL
# ============================================================
loss:
  core_method: point_pillar_VN_loss_NLL

  args:
    cls_weight: 1.0
    reg: 2.0

    log_var_min: -7.0
    log_var_max: 7.0

# ============================================================
# OPTIMIZER
# Same as hybrid baseline
# ============================================================
optimizer:
  core_method: Adam
  lr: 0.0002

  args:
    eps: 1e-10
    weight_decay: 1e-4

# ============================================================
# LR SCHEDULER
# Same as hybrid baseline
# ============================================================
lr_scheduler:
  core_method: cosineannealwarm
  epoches: *epoches
  warmup_lr: 2e-4
  warmup_epoches: 10
  lr_min: 2e-5